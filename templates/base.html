<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ app_name }} memprediksi risiko gagal jantung dengan Decision Tree dan menjelaskan setiap keputusannya.">
  <title>{% block title %}{% endblock %} | {{ app_name }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 38 38'%3E%3Crect x='6' y='6' width='30' height='30' rx='8' fill='%23111'/%3E%3Crect x='2' y='2' width='30' height='30' rx='8' fill='%232f6bff' stroke='%23111' stroke-width='3'/%3E%3Cpath d='M7 18h5l3-8 5 15 3-7h4' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip" href="#konten">Lewati ke konten</a>
  <header class="site-header">
    <div class="container header-in">
      <a class="brand" href="{{ url_for('index') }}">
        <svg viewBox="0 0 38 38" aria-hidden="true"><rect x="6" y="6" width="30" height="30" rx="8" fill="#111"/><rect x="2" y="2" width="30" height="30" rx="8" fill="#2f6bff" stroke="#111" stroke-width="3"/><path d="M7 18h5l3-8 5 15 3-7h4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="18" r="2.4" fill="#ff5c7c"/></svg>
        {{ app_name }}
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Buka menu"><span></span></button>
      <nav id="menu" class="menu" aria-label="Navigasi utama">
        {% for endpoint, label in nav %}
        <a href="{{ url_for(endpoint) }}"{% if endpoint == active %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main id="konten">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container">
      <p><strong>{{ app_name }}</strong> · Decision Tree · Flask · scikit-learn</p>
      <p>Aplikasi ini hanya untuk pembelajaran dan tidak menggantikan pemeriksaan medis.</p>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
